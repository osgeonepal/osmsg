name: Docker

on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          - target: cli
            image: ghcr.io/${{ github.repository }}
            smoke_entrypoint: /app/.venv/bin/osmsg
            smoke_args: --version
          - target: api
            image: ghcr.io/${{ github.repository }}-api
            smoke_entrypoint: /app/.venv/bin/python
            smoke_args: -c "import api.app"
          - target: worker
            image: ghcr.io/${{ github.repository }}-worker
            smoke_entrypoint: /bin/sh
            smoke_args: -c "python -c 'import osmsg._tick' && supercronic -version"
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Smoke the native arch before pushing; the multi-arch build below reuses these layers.
      - name: Build native image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: osmsg-smoke:${{ matrix.target }}
          cache-from: type=gha

      - name: Smoke test
        run: docker run --rm --entrypoint ${{ matrix.smoke_entrypoint }} osmsg-smoke:${{ matrix.target }} ${{ matrix.smoke_args }}

      # The amd64 smoke cannot see a wrong-arch binary, so check the arm64 supercronic directly.
      - name: Check arm64 supercronic
        if: matrix.target == 'worker'
        run: |
          docker buildx build --platform linux/arm64 --target supercronic --output type=local,dest="$RUNNER_TEMP/sc" .
          file "$RUNNER_TEMP/sc/supercronic" | tee /dev/stderr | grep aarch64

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
